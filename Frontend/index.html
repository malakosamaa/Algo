<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oxygen Therapy Simulator</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <div class="title-board">
      <h1>Oxygen Therapy Simulator</h1>
    </div>

    <div class="grid">
      <!-- LEFT: Inputs -->
      <div class="card">
        <h2>Inputs</h2>

        <label>Case Type:</label>
        <select id="caseType">
          <option value="Adult">Adult</option>
          <option value="COPD">COPD</option>
          <option value="Pediatric">Pediatric</option>
        </select>

        <label>Initial SpO₂:</label>
        <input type="number" id="s1" value="88" min="70" max="100"/>

        <label>Target SpO₂:</label>
        <input type="number" id="target" value="94" min="70" max="100"/>

        <div class="two">
          <div>
            <label>Safe Min:</label>
            <input type="number" id="sMin" value="92" min="70" max="100"/>
          </div>
          <div>
            <label>Safe Max:</label>
            <input type="number" id="sMax" value="96" min="70" max="100"/>
          </div>
        </div>

        <label>Time Horizon (T):</label>
        <input type="number" id="T" value="30" min="5" max="300"/>

        <label>Lambda (smoothness): <span id="lambdaVal">2</span></label>
        <input type="range" id="lambda" min="0" max="10" step="0.5" value="2"/>

        <div class="btnRow">
          <button id="presetAdult">Preset Adult</button>
          <button id="presetCOPD">Preset COPD</button>
          <button id="presetPeds">Preset Pediatric</button>
        </div>

        <div class="btnRow">
          <button id="runBtn" class="primary">Run Simulation</button>
          <button id="resetBtn">Reset</button>
        </div>

        <div id="status" class="status"></div>
      </div>

      <!-- RIGHT: Outputs -->
      <div class="card">
        <h2>Outputs</h2>

        <div class="kpis">
          <div class="kpi">
            <div class="kpiLabel">Cost</div>
            <div class="kpiValue" id="kpiCost">—</div>
          </div>
          <div class="kpi">
            <div class="kpiLabel">Time In Range</div>
            <div class="kpiValue" id="kpiRange">—</div>
          </div>
          <div class="kpi">
            <div class="kpiLabel">Flow Changes</div>
            <div class="kpiValue" id="kpiChanges">—</div>
          </div>
        </div>

        <h3>SpO₂ Chart</h3>
        <div class="chartBox">
          <canvas id="spo2Chart"></canvas>
        </div>

        <h3>Oxygen Flow Chart</h3>
        <div class="chartBox">
          <canvas id="flowChart"></canvas>
        </div>

        <h3>Plan Table</h3>
        <div class="tableWrap">
          <table id="planTable">
            <thead>
              <tr>
                <th>t</th>
                <th>Flow (L/min)</th>
                <th>SpO₂ (%)</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <h3>Raw JSON (debug)</h3>
        <pre id="output"></pre>
      </div>
    </div>
  </div>
  <h3>DP Table (Cost)</h3>
  <div class="tableWrap">
  <table id="dpTable">
    <thead></thead>
    <tbody></tbody>
  </table>
  </div>


  <script src="script.js"></script>
</body>
</html>

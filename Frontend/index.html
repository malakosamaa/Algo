<!DOCTYPE html>
<html>
<head>
  <title>Oxygen DP Simulator</title>
</head>
<body>

  <h1>Oxygen Therapy Simulator</h1>

  <label>Case Type:</label>
  <select id="caseType">
    <option value="Adult">Adult</option>
    <option value="COPD">COPD</option>
    <option value="Pediatric">Pediatric</option>
  </select><br><br>

  <label>Initial SpO₂:</label>
  <input type="number" id="s1" value="88"><br><br>

  <label>Target SpO₂:</label>
  <input type="number" id="target" value="94"><br><br>

  <label>Safe Min:</label>
  <input type="number" id="sMin" value="92"><br><br>

  <label>Safe Max:</label>
  <input type="number" id="sMax" value="96"><br><br>

  <label>Time Horizon (T):</label>
  <input type="number" id="T" value="30"><br><br>

  <label>Lambda:</label>
  <input type="number" id="lambda" value="2"><br><br>

  <button onclick="runSimulation()">Run Simulation</button>

  <h2>Output</h2>
  <pre id="output"></pre>

  <script src="script.js"></script>
</body>
</html>
